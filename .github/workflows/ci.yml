# Pruebas en cada push y pull request. Un push a main, si las pruebas pasan, se despliega en el
# servidor de Hetzner (ver deploy/README.md). Secretos del repositorio que hacen falta:
#   DEPLOY_HOST         IP (o dominio) del servidor
#   DEPLOY_SSH_KEY      clave privada cuya pública está en ~deploy/.ssh/authorized_keys
#   DEPLOY_KNOWN_HOSTS  salida de: ssh-keyscan -t ed25519 <IP>
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Un despliegue a medias no se cancela; las pruebas de otras ramas sí
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # el historial, para ver qué tests trae cada subida
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Lo mismo que el hook de pre-push: las novedades traen test e2e y el código, algún test
      - name: Tests para lo que se sube
        if: github.event_name == 'push' && !startsWith(github.event.before, '0000000')
        run: node tools/require-tests.js ${{ github.event.before }} ${{ github.sha }} ${{ github.ref }}
      - run: npm test

  # El juego en un navegador (Chrome ya viene en los runners de GitHub), repartido en 6 máquinas a la vez por lo que
  # tarda cada prueba (tests/e2e/times.json) y 2 pruebas a la vez en cada una (más, en una máquina del CI, les quita
  # CPU y las que miden tiempos fallan)
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
        env:
          E2E_SHARD: ${{ matrix.shard }}/6
          E2E_JOBS: 2
          E2E_TIMES: 1

  deploy:
    needs: [test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Parar el servidor espera a los combates en curso (hasta 5 min)
    timeout-minutes: 30
    environment: production
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      REL: /srv/arena/releases/${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Clave SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
      - name: Copiar el código
        # --link-dest: lo que no ha cambiado respecto a la versión actual no se vuelve a subir
        run: rsync -a --delete --exclude .git --exclude node_modules --exclude data --link-dest=/srv/arena/current/ ./ "deploy@$HOST:$REL/"
      - name: Instalar y reiniciar
        run: ssh "deploy@$HOST" bash "$REL/deploy/deploy.sh" "$REL"
